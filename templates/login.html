<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSHP: Вход в аккаунт</title>
    <link rel="icon" href="/static/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            flex-direction: column;
            position: relative;
        }

        /* ── Lava Lamp Background ── */
        .portal-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
            background-color: #ffffff;
        }

        .lava-blob-primary {
            position: absolute;
            top: -30%;
            right: -20%;
            width: 130vw;
            height: 130vw;
            background: #5059FF;
            border-radius: 40% 60% 30% 70%;
            filter: blur(40px);
            animation: floatBlob1 25s ease-in-out infinite alternate-reverse;
            transform-origin: center;
        }

        .lava-blob-red {
            position: absolute;
            bottom: -10%;
            left: -10%;
            width: 40vw;
            height: 40vw;
            background: #FF5050;
            border-radius: 60% 40% 70% 30%;
            filter: blur(35px);
            animation: floatBlob2 20s ease-in-out infinite alternate;
            transform-origin: center;
        }

        .lava-blob-red-small {
            position: absolute;
            top: 35%;
            left: 20%;
            width: 40vw;
            height: 40vw;
            background: #FF5050;
            border-radius: 60% 40% 70% 30%;
            filter: blur(25px);
            animation: floatBlob3 20s ease-in-out infinite alternate-reverse;
            transform-origin: center;
        }

        .lava-blob-primary-small {
            position: absolute;
            bottom: 25%;
            right: 25%;
            width: 45vw;
            height: 45vw;
            background: #5059FF;
            border-radius: 30% 70% 60% 40%;
            filter: blur(25px);
            animation: floatBlob3 20s ease-in-out infinite alternate-reverse;
            transform-origin: center;
        }

        @keyframes floatBlob1 {
            0% { transform: translate(0, 0) rotate(0deg) scale(1); }
            33% { transform: translate(-10vw, -5vh) rotate(-8deg) scale(1.15); }
            66% { transform: translate(5vw, -10vh) rotate(8deg) scale(0.95); }
            100% { transform: translate(-7vw, 7vh) rotate(-12deg) scale(1.1); }
        }

        @keyframes floatBlob2 {
            0% { transform: translate(0, 0) rotate(0deg) scale(1); }
            33% { transform: translate(8vw, -3vh) rotate(10deg) scale(1.2); }
            66% { transform: translate(-3vw, 5vh) rotate(-10deg) scale(0.8); }
            100% { transform: translate(5vw, -5vh) rotate(15deg) scale(1.1); }
        }

        @keyframes floatBlob3 {
            0% { transform: translate(0, 0) rotate(0deg) scale(1); }
            33% { transform: translate(-6vw, 6vh) rotate(-12deg) scale(1.1); }
            66% { transform: translate(7vw, -4vh) rotate(6deg) scale(0.9); }
            100% { transform: translate(-3vw, -8vh) rotate(-5deg) scale(1.05); }
        }

        /* ── Loader ── */
        .loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #5059FF;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeOut 0.6s 1.8s forwards;
            overflow: hidden;
        }

        .loader::before {
            content: '';
            position: absolute;
            width: 200vw;
            height: 200vh;
            background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.15) 0%, transparent 70%);
            animation: rotateGradient 3s infinite linear;
        }

        @keyframes rotateGradient {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loader-content {
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .loader-logo {
            width: 120px;
            animation: zoomPulse 1.5s infinite alternate;
            filter: drop-shadow(0 0 15px rgba(0, 0, 0, 0.2));
        }

        .loader h1 {
            color: #ffffff;
            font-size: 1.6rem;
            margin-top: 20px;
            animation: fadeInUp 0.8s 0.3s both;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.15);
        }

        @keyframes fadeOut {
            from { opacity: 1; visibility: visible; }
            to { opacity: 0; visibility: hidden; }
        }

        @keyframes zoomPulse {
            0% { transform: scale(0.9); }
            100% { transform: scale(1.1); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-50px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(50px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ── Login Animation Overlay ── */
        .login-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s, visibility 0.3s;
        }

        .login-animation.active {
            opacity: 1;
            visibility: visible;
        }

        .login-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(80, 89, 255, 0.15);
            border-top: 4px solid #5059FF;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 20px;
        }

        .login-message {
            font-size: 1rem;
            color: #333;
            font-weight: 600;
        }

        /* ── Site Title ── */
        .site-title {
            color: transparent;
            font-size: 2.5rem;
            text-align: center;
            margin-bottom: 30px;
            text-shadow: 0 0 0.5px #fff, 0 0 1px #fff, 0 0 2px #fff, 0 0 3px #fff;
            animation: fadeInUp 0.8s 2s both;
            font-weight: 700;
            letter-spacing: 1px;
            -webkit-text-stroke: 1px white;
            position: relative;
            z-index: 2;
        }

        /* ── Main Wrapper ── */
        .main-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 2;
        }

        /* ── Glass Card ── */
        .container {
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.85);
            border-radius: 24px;
            padding: 28px;
            width: 90%;
            max-width: 400px;
            margin-bottom: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            transform: scale(0);
            opacity: 0;
            animation: scaleIn 0.6s 2.2s forwards;
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #5059FF, #FF5050);
        }

        .container:hover {
            transform: translateY(-3px) scale(1.01);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);
        }

        /* ── Logo inside card ── */
        .card-logo {
            width: 64px;
            display: block;
            margin: 0 auto 16px;
            filter: drop-shadow(0 2px 8px rgba(80, 89, 255, 0.2));
        }

        /* ── Card Title ── */
        .card-title {
            color: #333;
            font-size: 1.3rem;
            text-align: center;
            margin-bottom: 6px;
            font-weight: 700;
            animation: slideInLeft 0.6s 2.4s both;
        }

        .card-subtitle {
            color: #999;
            font-size: 0.85rem;
            text-align: center;
            margin-bottom: 22px;
            animation: slideInLeft 0.6s 2.45s both;
        }

        /* ── Error ── */
        .alert {
            font-size: 0.85rem;
            color: #FF3A30;
            text-align: center;
            margin-bottom: 12px;
            font-weight: 600;
            min-height: 1.2em;
        }

        /* ── Form ── */
        .form-group {
            margin-bottom: 16px;
            opacity: 0;
            transform: translateX(-50px);
        }

        .form-group:nth-of-type(1) {
            animation: slideInLeft 0.5s 2.5s forwards;
        }

        .form-group:nth-of-type(2) {
            animation: slideInLeft 0.5s 2.6s forwards;
        }

        .form-group label {
            display: block;
            color: #666;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid rgba(0, 0, 0, 0.08);
            border-radius: 12px;
            font-size: 1rem;
            background-color: rgba(255, 255, 255, 0.8);
            color: #333;
            font-weight: 600;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
        }

        .form-group input::placeholder {
            color: rgba(0, 0, 0, 0.3);
            font-weight: 500;
        }

        .form-group input:focus {
            outline: none;
            border-color: #5059FF;
            background-color: rgba(255, 255, 255, 1);
            box-shadow: 0 0 15px rgba(80, 89, 255, 0.12);
            transform: translateY(-2px);
        }

        .form-group.has-error input {
            border-color: #FF3A30;
        }

        .form-group .field-error {
            display: none;
            color: #FF3A30;
            font-size: 0.78rem;
            font-weight: 600;
            margin-top: 6px;
            padding-left: 2px;
        }

        .form-group.has-error .field-error {
            display: block;
        }

        .input-wrap {
            position: relative;
        }

        .toggle-pass {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: rgba(0, 0, 0, 0.25);
            cursor: pointer;
            padding: 6px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s, background 0.2s;
            min-width: 36px;
            min-height: 36px;
        }

        .toggle-pass:hover {
            color: rgba(0, 0, 0, 0.5);
            background: rgba(0, 0, 0, 0.05);
        }

        /* ── Options Row ── */
        .form-options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            opacity: 0;
            animation: fadeInUp 0.5s 2.65s forwards;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            user-select: none;
            min-height: 44px;
        }

        .remember-me input[type="checkbox"] {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }

        .remember-me .checkmark {
            width: 20px;
            height: 20px;
            border-radius: 6px;
            border: 1.5px solid rgba(0, 0, 0, 0.15);
            background: rgba(255, 255, 255, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .remember-me input:checked + .checkmark {
            background: #5059FF;
            border-color: transparent;
            box-shadow: 0 2px 8px rgba(80, 89, 255, 0.3);
        }

        .remember-me .checkmark svg {
            width: 12px;
            height: 12px;
            color: #fff;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.2s;
        }

        .remember-me input:checked + .checkmark svg {
            opacity: 1;
            transform: scale(1);
        }

        .remember-me span {
            color: #888;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .forgot-link {
            color: #5059FF;
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
            transition: color 0.2s;
        }

        .forgot-link:hover {
            color: #3d44cc;
        }

        /* ── Submit Button ── */
        .btn-submit {
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            font-weight: 700;
            color: #FFF;
            background-color: #5059FF;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            transform: translateX(50px);
            opacity: 0;
            animation: slideInRight 0.5s 2.7s forwards;
            box-shadow: 0 5px 15px rgba(80, 89, 255, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: 'Inter', sans-serif;
        }

        .btn-submit:hover {
            background-color: #3d44cc;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(80, 89, 255, 0.35);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-submit::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 5px;
            height: 5px;
            background: rgba(255, 255, 255, 0.5);
            opacity: 0;
            border-radius: 100%;
            transform: scale(1, 1) translate(-50%);
            transform-origin: 50% 50%;
        }

        .btn-submit:hover::after {
            animation: ripple 1s ease-out;
        }

        @keyframes ripple {
            0% { transform: scale(0, 0); opacity: 0.5; }
            100% { transform: scale(20, 20); opacity: 0; }
        }

        .btn-submit .btn-loader {
            display: none;
            width: 20px;
            height: 20px;
            border: 2.5px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        .btn-submit.loading .btn-text { display: none; }
        .btn-submit.loading .btn-loader { display: block; }

        /* ── Support Button ── */
        .support-btn {
            background-color: rgba(0, 0, 0, 0.04);
            text-align: center;
            width: 100%;
            margin-top: 12px;
            color: rgba(0, 0, 0, 0.5);
            font-size: 0.85rem;
            border: none;
            cursor: pointer;
            padding: 10px;
            border-radius: 10px;
            transition: all 0.3s ease;
            opacity: 0;
            animation: fadeInUp 0.5s 2.8s forwards;
            font-family: 'Inter', sans-serif;
        }

        .support-btn:hover {
            background-color: rgba(0, 0, 0, 0.08);
            color: #333;
        }

        /* ── Register Link ── */
        .register-link {
            text-align: center;
            margin-top: 16px;
            color: #999;
            font-size: 0.85rem;
            opacity: 0;
            animation: fadeInUp 0.5s 2.85s forwards;
        }

        .register-link a {
            color: #5059FF;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .register-link a:hover {
            color: #3d44cc;
        }

        /* ── Footer ── */
        .footer {
            text-align: center;
            margin-top: 30px;
            opacity: 0;
            animation: fadeInUp 0.5s 2.9s forwards;
            position: relative;
            z-index: 2;
        }

        .footer .created-by {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.7rem;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
        }

        /* ── Responsive ── */
        @media (max-width: 767px) {
            .lava-blob-primary {
                width: 200vw;
                height: 200vw;
                top: -40%;
                right: -50%;
                filter: blur(60px);
            }

            .lava-blob-red {
                width: 110vw;
                height: 110vw;
                bottom: -30%;
                left: -30%;
                filter: blur(50px);
            }

            body {
                display: flex;
                flex-direction: column;
                justify-content: flex-start;
                height: auto;
                min-height: 100vh;
                overflow: auto;
                padding: 20px 0;
            }

            .site-title {
                margin-top: 8vh;
                margin-bottom: 24px;
                font-size: 2rem;
            }

            .main-wrapper {
                flex: 1 1 auto;
                display: flex;
                flex-direction: column;
                justify-content: flex-start;
                gap: 20px;
            }

            .container {
                margin-bottom: 0;
            }
        }

        @media (min-width: 768px) {
            .site-title {
                font-size: 3rem;
            }
        }

        @media (min-width: 992px) {
            .site-title {
                font-size: 3.5rem;
                margin-bottom: 40px;
            }
        }

        @media (min-width: 1200px) {
            .site-title {
                font-size: 4rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
            .portal-bg { display: none; }
            .loader { display: none; }
        }
    </style>
</head>
<body>
    <!-- Lava Lamp Background -->
    <div class="portal-bg">
        <div class="lava-blob-primary"></div>
        <div class="lava-blob-red"></div>
        <div class="lava-blob-red-small"></div>
        <div class="lava-blob-primary-small"></div>
    </div>

    <!-- Login Animation Overlay -->
    <div class="login-animation" id="loginAnimation">
        <div class="login-spinner"></div>
        <div class="login-message">Вход в аккаунт...</div>
    </div>

    <!-- Loader -->
    <div class="loader" id="loader">
        <div class="loader-content">
            <img src="/static/favicon.png" alt="MSHP" class="loader-logo">
            <h1>MSHP</h1>
        </div>
    </div>

    <h1 class="site-title">MSHP Panel</h1>

    <div class="main-wrapper">
        <div class="container">
            <img src="/static/favicon.png" alt="MSHP" class="card-logo">
            <div class="card-title">Вход в аккаунт</div>
            <div class="card-subtitle">Введите данные для входа</div>

            <div class="alert" id="error-message"></div>

            <form id="loginForm" method="POST" action="/login" novalidate>
                <div class="form-group" id="fg-login">
                    <label for="login">Логин</label>
                    <div class="input-wrap">
                        <input
                            type="text"
                            id="login"
                            name="login"
                            placeholder="Введите логин"
                            autocomplete="username"
                            required
                            aria-describedby="login-error"
                        >
                    </div>
                    <div class="field-error" id="login-error" role="alert"></div>
                </div>

                <div class="form-group" id="fg-password">
                    <label for="password">Пароль</label>
                    <div class="input-wrap">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Введите пароль"
                            autocomplete="current-password"
                            required
                            aria-describedby="password-error"
                        >
                        <button type="button" class="toggle-pass" id="togglePass" aria-label="Показать пароль">
                            <i class="fa-solid fa-eye" id="eyeIcon"></i>
                        </button>
                    </div>
                    <div class="field-error" id="password-error" role="alert"></div>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" name="remember" checked>
                        <div class="checkmark">
                            <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="2.5 6 5 8.5 9.5 3.5"></polyline>
                            </svg>
                        </div>
                        <span>Запомнить</span>
                    </label>
                    <a href="#" class="forgot-link">Забыли пароль?</a>
                </div>

                <button type="submit" class="btn-submit" id="btnLogin">
                    <span class="btn-text">Войти</span>
                    <div class="btn-loader"></div>
                </button>
            </form>

        </div>
    </div>

    <div class="footer">
        <div class="created-by">MSHP Panel</div>
    </div>

    <script>
        // Toggle password
        document.getElementById('togglePass').addEventListener('click', function() {
            const inp = document.getElementById('password');
            const icon = document.getElementById('eyeIcon');
            if (inp.type === 'password') {
                inp.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                inp.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        });

        // Inline validation on blur
        function validateField(input, errorId, message) {
            const group = input.closest('.form-group');
            const errorEl = document.getElementById(errorId);
            if (!input.value.trim()) {
                group.classList.add('has-error');
                errorEl.textContent = message;
                return false;
            }
            group.classList.remove('has-error');
            errorEl.textContent = '';
            return true;
        }

        const loginInput = document.getElementById('login');
        const passwordInput = document.getElementById('password');

        loginInput.addEventListener('blur', () => validateField(loginInput, 'login-error', 'Введите логин'));
        passwordInput.addEventListener('blur', () => validateField(passwordInput, 'password-error', 'Введите пароль'));

        loginInput.addEventListener('input', () => {
            const g = loginInput.closest('.form-group');
            if (g.classList.contains('has-error')) validateField(loginInput, 'login-error', 'Введите логин');
        });
        passwordInput.addEventListener('input', () => {
            const g = passwordInput.closest('.form-group');
            if (g.classList.contains('has-error')) validateField(passwordInput, 'password-error', 'Введите пароль');
        });

        // Submit
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            const loginOk = validateField(loginInput, 'login-error', 'Введите логин');
            const passOk = validateField(passwordInput, 'password-error', 'Введите пароль');
            if (!loginOk || !passOk) {
                e.preventDefault();
                const first = document.querySelector('.form-group.has-error input');
                if (first) first.focus();
                return;
            }
            document.getElementById('loginAnimation').classList.add('active');
            document.getElementById('btnLogin').classList.add('loading');
        });
    </script>
</body>
