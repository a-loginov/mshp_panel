<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSHP: Регистрация</title>
    <link rel="icon" href="/static/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..24,300..500,0..1,0" rel="stylesheet">
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 20;
            font-size: 20px; line-height: 1; vertical-align: middle; user-select: none;
        }

        :root {
            --bg: #f5f5f5;
            --ink: #111111;
            --ink-soft: #6b6b6b;
            --line: #e2e2e2;
            --panel: #ffffff;
            --panel-border: rgba(255,255,255,0.6);
            --panel-shadow: 0 30px 70px -25px rgba(0,0,0,0.25);
            --input-bg: #ffffff;
            --radius-lg: 28px;
            --radius-md: 18px;
            --accent: #5059FF;
            --accent-hover: #3d44cc;
            --overlay-bg: rgba(245,245,245,0.92);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f0f12;
                --ink: #f0f0f0;
                --ink-soft: #8a8a9a;
                --line: rgba(255,255,255,0.1);
                --panel: rgba(28, 28, 35, 0.82);
                --panel-border: rgba(255,255,255,0.08);
                --panel-shadow: 0 30px 70px -25px rgba(0,0,0,0.6);
                --input-bg: rgba(38, 38, 48, 0.8);
                --accent: #6b75ff;
                --accent-hover: #818aff;
                --overlay-bg: rgba(15,15,18,0.92);
            }
        }

        * { box-sizing: border-box; }
        html, body { height: 100%; }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: "Montserrat", -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; position: relative;
        }

        .lava { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
        .blob { position: absolute; width: 46vmax; height: 46vmax; filter: blur(60px); will-change: transform, border-radius; }
        .blob--primary { left: -14vmax; top: -10vmax; background: var(--accent); opacity: 0.18; animation: drift-a 22s ease-in-out infinite; }
        .blob--red { right: -16vmax; bottom: -14vmax; background: #FF5050; opacity: 0.14; animation: drift-b 26s ease-in-out infinite; }
        @keyframes drift-a {
            0%   { border-radius: 42% 58% 63% 37% / 41% 44% 56% 59%; transform: translate(0, 0) scale(1); }
            33%  { border-radius: 63% 37% 41% 59% / 55% 63% 37% 45%; transform: translate(3vmax, 4vmax) scale(1.06); }
            66%  { border-radius: 37% 63% 56% 44% / 33% 52% 48% 67%; transform: translate(-2vmax, 3vmax) scale(0.97); }
            100% { border-radius: 42% 58% 63% 37% / 41% 44% 56% 59%; transform: translate(0, 0) scale(1); }
        }
        @keyframes drift-b {
            0%   { border-radius: 55% 45% 38% 62% / 47% 40% 60% 53%; transform: translate(0, 0) scale(1); }
            33%  { border-radius: 40% 60% 62% 38% / 62% 48% 52% 38%; transform: translate(-4vmax, -3vmax) scale(1.05); }
            66%  { border-radius: 62% 38% 45% 55% / 38% 58% 42% 62%; transform: translate(3vmax, -4vmax) scale(0.96); }
            100% { border-radius: 55% 45% 38% 62% / 47% 40% 60% 53%; transform: translate(0, 0) scale(1); }
        }
        @media (prefers-reduced-motion: reduce) {
            .blob { animation: none !important; }
            .stage, .panel, .panel__head, .field, .btn, .divider, .panel__foot { opacity: 1 !important; transform: none !important; animation: none !important; }
        }

        @keyframes fadeOut { from { opacity: 1; visibility: visible; } to { opacity: 0; visibility: hidden; pointer-events: none; } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes scaleIn { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: scale(1); } }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .loader {
            position: fixed; inset: 0; background: var(--accent);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000; animation: fadeOut 0.5s 1.6s forwards; overflow: hidden;
        }
        .loader::before {
            content: ''; position: absolute; width: 200vw; height: 200vh;
            background: radial-gradient(ellipse at center, rgba(255,255,255,0.15) 0%, transparent 70%);
            animation: rotateGradient 3s infinite linear;
        }
        @keyframes rotateGradient { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loader-content { text-align: center; position: relative; z-index: 10; }
        .loader-logo { width: 100px; animation: zoomPulse 1.4s infinite alternate; filter: drop-shadow(0 4px 16px rgba(0,0,0,0.15)); }
        @keyframes zoomPulse { 0% { transform: scale(0.9); } 100% { transform: scale(1.1); } }
        .loader h1 { color: #fff; font-size: 1.5rem; margin-top: 18px; animation: fadeInUp 0.6s 0.2s both; font-weight: 700; }

        .login-animation {
            position: fixed; inset: 0; background: var(--overlay-bg);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            z-index: 2000; display: flex; align-items: center; justify-content: center;
            flex-direction: column; gap: 16px; opacity: 0; visibility: hidden;
            transition: opacity 0.25s, visibility 0.25s;
        }
        .login-animation.active { opacity: 1; visibility: visible; }
        .login-spinner { width: 40px; height: 40px; border: 3px solid var(--line); border-top: 3px solid var(--accent); border-radius: 50%; animation: spin 0.75s linear infinite; }
        .login-message { font-size: 0.95rem; color: var(--ink); font-weight: 600; }

        .stage { position: relative; z-index: 1; width: 100%; padding: 24px; display: flex; justify-content: center; }

        .panel {
            width: 100%; max-width: 380px;
            background: var(--panel);
            backdrop-filter: blur(22px) saturate(140%); -webkit-backdrop-filter: blur(22px) saturate(140%);
            border: 1px solid var(--panel-border);
            border-radius: var(--radius-lg);
            box-shadow: var(--panel-shadow);
            padding: 40px 32px 32px;
            opacity: 0; animation: scaleIn 0.5s 1.8s cubic-bezier(0.16,1,0.3,1) forwards;
        }
        .panel__head { text-align: center; margin-bottom: 28px; opacity: 0; animation: fadeInUp 0.45s 2s both; }
        .mark { width: 44px; height: 44px; margin: 0 auto 16px; border-radius: 12px; object-fit: cover; display: block; box-shadow: 0 6px 16px -6px rgba(0,0,0,0.2); }
        .panel__head h1 { font-size: 22px; font-weight: 700; margin: 0 0 6px; }
        .panel__head p { margin: 0; font-size: 14px; color: var(--ink-soft); }

        .form { display: flex; flex-direction: column; gap: 14px; }
        .field { display: flex; flex-direction: column; gap: 6px; opacity: 0; }
        .field:nth-child(1) { animation: fadeInUp 0.35s 2.1s both; }
        .field:nth-child(2) { animation: fadeInUp 0.35s 2.15s both; }
        .field:nth-child(3) { animation: fadeInUp 0.35s 2.2s both; }
        .field:nth-child(4) { animation: fadeInUp 0.35s 2.25s both; }
        .field__label { font-size: 13px; font-weight: 600; color: var(--ink); }
        .field input {
            appearance: none; border: 1px solid var(--line); background: var(--input-bg);
            border-radius: var(--radius-md); padding: 13px 16px; font-size: 15px;
            color: var(--ink); outline: none; transition: border-color 0.15s, box-shadow 0.15s;
            font-family: inherit;
        }
        .field input::placeholder { color: #b3b3b3; }
        .field input:focus-visible { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 15%, transparent); }
        .field.has-error input { border-color: #FF3A30; }
        .field .field-error { display: none; color: #FF3A30; font-size: 12px; font-weight: 600; line-height: 1.4; }
        .field.has-error .field-error { display: block; }

        .btn {
            appearance: none; border: none; border-radius: var(--radius-md);
            padding: 14px 18px; font-size: 15px; font-weight: 600;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            gap: 10px; text-decoration: none;
            transition: transform 0.12s, opacity 0.15s, background 0.15s;
            font-family: inherit; opacity: 0;
        }
        .btn:active { transform: scale(0.98); }
        .btn--primary { background: var(--accent); color: #fff; margin-top: 4px; animation: fadeInUp 0.35s 2.3s both; }
        .btn--primary:hover { background: var(--accent-hover); }
        .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
        .btn .btn-loader { display: none; width: 18px; height: 18px; border: 2.5px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; }
        .btn.loading .btn-text { display: none; }
        .btn.loading .btn-loader { display: block; }

        .divider { display: flex; align-items: center; gap: 12px; margin: 22px 0 16px; color: var(--ink-soft); font-size: 12px; opacity: 0; animation: fadeInUp 0.45s 2.35s both; }
        .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }

        .panel__foot { text-align: center; margin: 22px 0 0; font-size: 13px; color: var(--ink-soft); opacity: 0; animation: fadeInUp 0.45s 2.4s both; }
        .panel__foot a { color: var(--ink); font-weight: 600; text-decoration: none; }
        .panel__foot a:hover { text-decoration: underline; }

        .password-hints { display: flex; flex-direction: column; gap: 4px; margin-top: 2px; }
        .password-hint { font-size: 11.5px; color: var(--ink-soft); display: flex; align-items: center; gap: 5px; }
        .password-hint.met { color: #22C55E; }
        .password-hint .material-symbols-outlined { font-size: 14px; }

        @media (max-width: 420px) {
            .panel { padding: 32px 22px 26px; border-radius: var(--radius-md); }
            .blob { filter: blur(80px); }
        }
        @media (min-width: 900px) {
            body { overflow: auto; }
            .stage { padding: 40px; min-height: 100vh; min-height: 100dvh; align-items: center; }
            .panel { max-width: 432px; padding: 48px 44px 40px; border-radius: 32px; }
            .mark { width: 52px; height: 52px; margin-bottom: 20px; }
            .panel__head { margin-bottom: 32px; }
            .panel__head h1 { font-size: 25px; }
            .panel__head p { font-size: 15px; }
            .field input, .btn { padding: 15px 18px; font-size: 16px; }
            .blob { width: 38vmax; height: 38vmax; }
        }
        @media (min-width: 1100px) { .panel { max-width: 440px; } .blob { width: 34vmax; height: 34vmax; } }
        @media (min-width: 1440px) { .panel { max-width: 460px; padding: 52px 48px 44px; } .blob { width: 30vmax; height: 30vmax; } }
    </style>
</head>
<body>
    <div class="lava" aria-hidden="true">
        <div class="blob blob--primary"></div>
        <div class="blob blob--red"></div>
    </div>

    <div class="login-animation" id="loginAnimation">
        <div class="login-spinner"></div>
        <div class="login-message">Создание аккаунта...</div>
    </div>

    <div class="loader" id="loader">
        <div class="loader-content">
            <img src="/static/favicon.png" alt="MSHP" class="loader-logo">
            <h1>MSHP</h1>
        </div>
    </div>

    <main class="stage">
        <section class="panel">
            <div class="panel__head">
                <img class="mark" src="/static/favicon.png" alt="MSHP">
                <h1>Регистрация</h1>
                <p>Создайте аккаунт, чтобы продолжить</p>
            </div>

            <form class="form" id="registerForm" method="POST" action="/register" novalidate>
                <label class="field {{ 'has-error' if errors and errors.login }}">
                    <span class="field__label">Логин</span>
                    <input type="text" name="login" id="login" placeholder="Придумайте логин" autocomplete="username" required value="{{ form_data.login if form_data else '' }}">
                    <span class="field-error" id="login-error" role="alert">{{ errors.login if errors and errors.login else '' }}</span>
                </label>

                <label class="field {{ 'has-error' if errors and errors.email }}">
                    <span class="field__label">Email</span>
                    <input type="email" name="email" id="email" placeholder="example@mail.ru" autocomplete="email" required value="{{ form_data.email if form_data else '' }}">
                    <span class="field-error" id="email-error" role="alert">{{ errors.email if errors and errors.email else '' }}</span>
                </label>

                <label class="field">
                    <span class="field__label">Пароль</span>
                    <div style="position:relative;">
                        <input type="password" name="password" id="password" placeholder="Придумайте пароль" autocomplete="new-password" required style="width:100%;padding-right:44px;">
                        <button type="button" id="togglePass" aria-label="Показать пароль" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#b3b3b3;padding:6px;border-radius:8px;transition:color 0.15s;">
                            <span class="material-symbols-outlined" id="eyeIcon" style="font-size:20px;">visibility_off</span>
                        </button>
                    </div>
                    <div class="password-hints" id="passwordHints">
                        <span class="password-hint" id="hint-length"><span class="material-symbols-outlined">radio_button_unchecked</span>Не менее 8 символов</span>
                        <span class="password-hint" id="hint-upper"><span class="material-symbols-outlined">radio_button_unchecked</span>Заглавная буква</span>
                        <span class="password-hint" id="hint-digit"><span class="material-symbols-outlined">radio_button_unchecked</span>Цифра</span>
                    </div>
                    <span class="field-error" id="password-error" role="alert"></span>
                </label>

                <label class="field">
                    <span class="field__label">Повторите пароль</span>
                    <input type="password" name="confirm_password" id="confirm_password" placeholder="Повторите пароль" autocomplete="new-password" required>
                    <span class="field-error" id="confirm-password-error" role="alert"></span>
                </label>

                <button type="submit" class="btn btn--primary" id="btnRegister">
                    <span class="btn-text">Создать аккаунт</span>
                    <div class="btn-loader"></div>
                </button>
            </form>

            <div class="divider"><span>или</span></div>

            <p class="panel__foot">Уже есть аккаунт? <a href="/login">Войти</a></p>
        </section>
    </main>

    <script>
        function validateField(input, errorId, message) {
            const field = input.closest('.field');
            const errorEl = document.getElementById(errorId);
            if (!input.value.trim()) {
                field.classList.add('has-error');
                errorEl.textContent = message;
                return false;
            }
            field.classList.remove('has-error');
            errorEl.textContent = '';
            return true;
        }

        const loginInput = document.getElementById('login');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const confirmInput = document.getElementById('confirm_password');

        loginInput.addEventListener('blur', () => validateField(loginInput, 'login-error', 'Введите логин'));
        emailInput.addEventListener('blur', () => {
            if (!validateField(emailInput, 'email-error', 'Введите email')) return;
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailInput.value)) {
                emailInput.closest('.field').classList.add('has-error');
                document.getElementById('email-error').textContent = 'Некорректный email';
            }
        });
        passwordInput.addEventListener('blur', () => validateField(passwordInput, 'password-error', 'Введите пароль'));
        confirmInput.addEventListener('blur', () => {
            if (!validateField(confirmInput, 'confirm-password-error', 'Подтвердите пароль')) return;
            if (confirmInput.value !== passwordInput.value) {
                confirmInput.closest('.field').classList.add('has-error');
                document.getElementById('confirm-password-error').textContent = 'Пароли не совпадают';
            }
        });

        [loginInput, emailInput, passwordInput, confirmInput].forEach(input => {
            input.addEventListener('input', () => {
                const f = input.closest('.field');
                if (f.classList.contains('has-error')) {
                    f.classList.remove('has-error');
                    f.querySelector('.field-error').textContent = '';
                }
            });
        });

        passwordInput.addEventListener('input', function () {
            const v = this.value;
            const len = document.getElementById('hint-length');
            const upper = document.getElementById('hint-upper');
            const digit = document.getElementById('hint-digit');

            function setHint(el, met) {
                el.classList.toggle('met', met);
                el.querySelector('.material-symbols-outlined').textContent = met ? 'check_circle' : 'radio_button_unchecked';
            }
            setHint(len, v.length >= 8);
            setHint(upper, /[A-ZА-ЯЁ]/.test(v));
            setHint(digit, /[0-9]/.test(v));
        });

        document.getElementById('togglePass').addEventListener('click', function () {
            const inp = document.getElementById('password');
            const icon = document.getElementById('eyeIcon');
            if (inp.type === 'password') { inp.type = 'text'; icon.textContent = 'visibility'; }
            else { inp.type = 'password'; icon.textContent = 'visibility_off'; }
        });

        document.getElementById('registerForm').addEventListener('submit', function (e) {
            let ok = true;

            if (!validateField(loginInput, 'login-error', 'Введите логин')) ok = false;

            if (!validateField(emailInput, 'email-error', 'Введите email')) ok = false;
            else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailInput.value)) {
                emailInput.closest('.field').classList.add('has-error');
                document.getElementById('email-error').textContent = 'Некорректный email';
                ok = false;
            }

            if (!validateField(passwordInput, 'password-error', 'Введите пароль')) ok = false;
            else if (passwordInput.value.length < 8) {
                passwordInput.closest('.field').classList.add('has-error');
                document.getElementById('password-error').textContent = 'Минимум 8 символов';
                ok = false;
            }

            if (!validateField(confirmInput, 'confirm-password-error', 'Подтвердите пароль')) ok = false;
            else if (confirmInput.value !== passwordInput.value) {
                confirmInput.closest('.field').classList.add('has-error');
                document.getElementById('confirm-password-error').textContent = 'Пароли не совпадают';
                ok = false;
            }

            if (!ok) {
                e.preventDefault();
                const first = document.querySelector('.field.has-error input');
                if (first) first.focus();
                return;
            }

            document.getElementById('loginAnimation').classList.add('active');
            document.getElementById('btnRegister').classList.add('loading');
        });
    </script>
</body>
</html>
